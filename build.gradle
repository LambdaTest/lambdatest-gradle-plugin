plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.0'
    id 'com.diffplug.spotless' version '6.25.0'
}

// Brand switch for the Gradle Plugin Portal.
// By default the build publishes io.github.lambdatest.gradle exactly as before.
// Build with -Pbrand=testmuai to publish the same plugin as com.testmuai.gradle.
// Only the plugin ID, group and listing text change; the code and task names stay the same.
def brand = (findProperty('brand') ?: 'lambdatest').toString().toLowerCase()
def brands = [
    lambdatest: [
        group      : 'io.github.lambdatest',
        id         : 'io.github.lambdatest.gradle',
        website    : 'https://www.lambdatest.com',
        displayName: 'LambdaTest Gradle Plugin',
        description: 'Runs Espresso tests on LambdaTest',
        tags       : ['espresso', 'test', 'lambdatest', 'app', 'automation', 'appautomation'],
    ],
    testmuai: [
        group      : 'com.testmuai',
        id         : 'com.testmuai.gradle',
        website    : 'https://www.testmuai.com',
        displayName: 'TestMu AI Gradle Plugin',
        description: 'Runs Espresso tests on TestMu AI (formerly LambdaTest)',
        tags       : ['espresso', 'test', 'testmuai', 'lambdatest', 'app', 'automation', 'appautomation'],
    ],
]
if (!brands.containsKey(brand)) {
    throw new GradleException("Unknown brand '${brand}'. Use lambdatest (default) or testmuai.")
}
def b = brands[brand]

version = '1.0.7'
group = b.group

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    
}

test {
    useJUnitPlatform()
    jvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    ]
}

gradlePlugin {
    website = b.website
    vcsUrl = 'https://github.com/LambdaTest/lambdatest-gradle-plugin'
    plugins {
        lambdatestPlugin {
            id = b.id
            implementationClass = 'io.github.lambdatest.gradle.LambdaTestPlugin'
            displayName = b.displayName
            description = b.description
            tags.set(b.tags)
        }
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat().aosp()
        formatAnnotations()
    }
}

test {
    useJUnitPlatform()
}

javadoc {
    options.tags = [ "implNote:a:Implementation Note:" ]
}
